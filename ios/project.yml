# XcodeGen spec — the .xcodeproj is generated from this file (and git-ignored).
#   brew install xcodegen && cd ios && xcodegen generate && open NykaaFashion.xcodeproj
#
# Why XcodeGen: project.yml is human-readable and diffs cleanly; a hand-edited
# .pbxproj does neither. If you'd rather commit the .xcodeproj, generate it once
# and remove `*.xcodeproj` from ios/.gitignore.

name: NykaaFashion

options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.2"                             # latest iOS, same as One Moment — no availability fallbacks anywhere

settings:
  base:
    SWIFT_VERSION: "5.0"                    # Swift 6 language mode is a later, deliberate step
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                    # TODO: your Apple Developer Team ID (needed for device builds)

targets:
  NykaaFashion:
    type: application
    platform: iOS
    sources:
      - path: NykaaFashion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nykaafashion   # TODO: replace with the real bundle ID
        TARGETED_DEVICE_FAMILY: "1"                            # iPhone only for v1; iPad is a later phase
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist                     # partial plist: UIAppFonts (Inter Display). Merged with the generated keys.
        INFOPLIST_KEY_CFBundleDisplayName: Nykaa Fashion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  NykaaFashionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NykaaFashionTests
    dependencies:
      - target: NykaaFashion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nykaafashion.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NykaaFashion:
    build:
      targets:
        NykaaFashion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NykaaFashionTests
